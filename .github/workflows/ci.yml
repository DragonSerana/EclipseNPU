# Per-push / per-PR CI. Pulls the cached LLVM/MLIR image layers from GHCR
# (built by build-image.yml), compiles the compiler, runs all three test gates.
# On a cold repo (no image in GHCR yet) the first run builds the image.
name: ci

on:
  push:
  pull_request:

env:
  LLVM_COMMIT: a67efda258fa73c7b6b915fb31b8412b800a15e9

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute GHCR image ref
        id: img
        run: |
          echo "ref=ghcr.io/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')/eclipse-ci" \
            >> "$GITHUB_OUTPUT"

      # Restore the LLVM/MLIR layers from the prebuilt image (or build on cold start).
      - name: Build image from GHCR cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          load: true
          push: false
          tags: eclipse-ci:latest
          cache-from: |
            type=registry,ref=${{ steps.img.outputs.ref }}:${{ env.LLVM_COMMIT }}
            type=registry,ref=${{ steps.img.outputs.ref }}:cache

      - name: Compile + run tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -e LLVM_INSTALL_DIR=/usr/local \
            -e MLIR_INSTALL_DIR=/usr/local \
            -e MLIR_OPT=/usr/local/bin/mlir-opt \
            -e FILECHECK=/usr/local/bin/FileCheck \
            -e NOT=/usr/local/bin/not \
            -w /workspace \
            eclipse-ci:latest \
            bash -lc <<'SCRIPT'
              set -ex
              which cmake && which ninja
              cmake -S . -B build \
                -DMLIR_DIR=/usr/local/lib/cmake/mlir \
                -DLLVM_DIR=/usr/local/lib/cmake/llvm \
                -G Ninja
              cmake --build build -j"$(nproc)"
              cmake --build build --target check-eclipse check-golden check-accuracy
            SCRIPT
