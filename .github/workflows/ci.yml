# Per-push / per-PR CI. Pulls the prebuilt LLVM/MLIR image from GHCR
# (built by build-image.yml), compiles the compiler, runs all three test gates.
name: ci

on:
  push:
  pull_request:

env:
  LLVM_COMMIT: a67efda258fa73c7b6b915fb31b8412b800a15e9

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute GHCR image ref
        id: img
        run: |
          echo "ref=ghcr.io/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')/eclipse-ci" \
            >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the prebuilt image and run the compiler build + the test gates.
      - name: Compile + run tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -e LLVM_INSTALL_DIR=/usr/local \
            -e MLIR_INSTALL_DIR=/usr/local \
            -e MLIR_OPT=/llvm-project/build/bin/mlir-opt \
            -e FILECHECK=/llvm-project/build/bin/FileCheck \
            -e NOT=/llvm-project/build/bin/not \
            -w /workspace \
            ${{ steps.img.outputs.ref }}:${{ env.LLVM_COMMIT }} \
            bash scripts/run-tests.sh
