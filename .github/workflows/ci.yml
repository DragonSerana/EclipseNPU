name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build (or restore from cache) the image with LLVM/MLIR baked in.
      # The LLVM build layer is cached via GitHub Actions gha cache, so only
      # the first run builds MLIR from scratch.
      - name: Build LLVM/MLIR image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          load: true
          push: false
          tags: eclipse-ci:latest
          cache-from: type=gha,scope=eclipse-ci
          cache-to: type=gha,scope=eclipse-ci,mode=max

      # Build the compiler and run all three test targets inside the container.
      - name: Build + test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -e LLVM_INSTALL_DIR=/usr/local \
            -e MLIR_INSTALL_DIR=/usr/local \
            -e MLIR_OPT=/usr/local/bin/mlir-opt \
            -e FILECHECK=/usr/local/bin/FileCheck \
            -e NOT=/usr/local/bin/not \
            -w /workspace \
            eclipse-ci:latest \
            bash -c '
              set -ex
              cmake -S . -B build \
                -DMLIR_DIR=/usr/local/lib/cmake/mlir \
                -DLLVM_DIR=/usr/local/lib/cmake/llvm
              cmake --build build -j"$(nproc)"
              cmake --build build --target check-eclipse check-golden check-accuracy
            '
